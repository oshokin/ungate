name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@10.33.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium with system dependencies
        if: runner.os == 'Linux'
        run: pnpm --filter @ungate/scripts exec playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: pnpm --filter @ungate/scripts exec playwright install chromium
      - name: Build, test, and package
        run: pnpm package
      - name: Upload VSIX
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: runner.os == 'Linux'
        with:
          name: ungate-vsix
          path: apps/extension/out/ungate-*.vsix
          if-no-files-found: error
          retention-days: 7
